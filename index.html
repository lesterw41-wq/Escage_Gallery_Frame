<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Escage Frame - 画廊装裱与无缝切片</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap');

      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #0f1115;
      color: #e4e4e7;
    }

    }

    }

      background: #3f3f46;
      border-radius: 3px;
    }

</head>
<body class="min-h-screen flex flex-col lg:flex-row overflow-x-hidden">

  <!-- 左侧控制面板 -->

      </div>
      <span class="text-[10px] font-mono bg-zinc-800 text-zinc-300 px-2 py-1 rounded border border-zinc-700">3×1080×1800</span>
    </div>

    <div class="p-5 space-y-5 overflow-y-auto flex-1">
      <!-- 1. 上传主照片 -->
      <div>
        <label class="block text-xs font-semibold uppercase tracking-wider text-zinc-400 mb-2">1. 上传摄影作品 (支持自动读 EXIF)</label>
        <div id="dropZone" class="border-2 border-dashed border-zinc-700 hover:border-white transition-colors rounded-lg p-5 text-center cursor-pointer bg-zinc-950/50">
          <input type="file" id="photoInput" accept="image/jpeg,image/png,image/webp" class="hidden" />
          <svg class="w-7 h-7 mx-auto text-zinc-400 mb-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"></path>
          </svg>
          <p class="text-xs text-zinc-300 font-medium">点击或拖拽原图到此处</p>
          <p class="text-[11px] text-zinc-500 mt-1">左上角锚点对齐 · 宽/短边锁定 900px 等比缩放</p>
        </div>
        <div id="exifStatus" class="mt-2 text-[11px] text-zinc-400 hidden flex items-center gap-1.5"></div>
      </div>

      <!-- 2. 器材与参数铭牌 -->
      <div class="space-y-3 pt-2 border-t border-zinc-800/80">
        <div class="flex items-center justify-between">
          <label class="block text-xs font-semibold uppercase tracking-wider text-zinc-400">2. 器材与参数徽章</label>
          <span class="text-[10px] text-zinc-500">距画框 70px · 间距 6px</span>
        </div>

        <!-- 相机型号 -->
        <div>
          <label class="block text-[11px] text-zinc-400 mb-1">相机型号 (自适应黑底长条)</label>
          <input type="text" id="cameraInput" value="SONY A6400" placeholder="例如: SONY A6400"
            class="w-full bg-zinc-950 border border-zinc-700 focus:border-white rounded px-3 py-1.5 text-xs text-white font-semibold tracking-wide outline-none" />
          <div class="flex flex-wrap gap-1.5 mt-1.5">
            <button type="button" onclick="setCamera('SONY A6400')" class="text-[10px] bg-zinc-800 hover:bg-zinc-700 text-zinc-300 px-2 py-0.5 rounded transition">SONY A6400</button>
            <button type="button" onclick="setCamera('DJI AIR 3S')" class="text-[10px] bg-zinc-800 hover:bg-zinc-700 text-zinc-300 px-2 py-0.5 rounded transition">DJI AIR 3S</button>
            <button type="button" onclick="setCamera('OSMO POCKET 3')" class="text-[10px] bg-zinc-800 hover:bg-zinc-700 text-zinc-300 px-2 py-0.5 rounded transition">POCKET 3</button>
            <button type="button" onclick="setCamera('PHOENIX 205')" class="text-[10px] bg-zinc-800 hover:bg-zinc-700 text-zinc-300 px-2 py-0.5 rounded transition">凤凰 205</button>
          </div>
        </div>

        <!-- 四项核心参数：焦段 -> 光圈 -> 快门 -> ISO -->
        <div>
          <label class="block text-[11px] text-zinc-400 mb-1.5">核心参数徽章 (按视觉优先级排序，间距 6px)</label>
          <div class="grid grid-cols-2 gap-2">
            <div>
              <span class="text-[10px] text-zinc-500 block mb-0.5">① 焦段 (视角)</span>

                class="w-full bg-zinc-950 border border-zinc-700 focus:border-white rounded px-2.5 py-1.5 text-xs font-mono text-white outline-none" />
            </div>
            <div>
              <span class="text-[10px] text-zinc-500 block mb-0.5">② 光圈 (景深)</span>

                class="w-full bg-zinc-950 border border-zinc-700 focus:border-white rounded px-2.5 py-1.5 text-xs font-mono text-white outline-none" />
            </div>
            <div>
              <span class="text-[10px] text-zinc-500 block mb-0.5">③ 快门 (动态)</span>
              <input type="text" id="shutterInput" value="1/30" placeholder="1/250"
                class="w-full bg-zinc-950 border border-zinc-700 focus:border-white rounded px-2.5 py-1.5 text-xs font-mono text-white outline-none" />
            </div>
            <div>
              <span class="text-[10px] text-zinc-500 block mb-0.5">④ ISO (感光度)</span>

        <div class="flex items-center justify-between gap-2 pt-0.5">
          <label class="flex-1 cursor-pointer bg-zinc-800 hover:bg-zinc-700 text-zinc-200 text-xs py-2 px-3 rounded text-center transition border border-zinc-700">
            <span>临时上传本地砖墙图</span>

          <button type="button" id="resetBgBtn" class="bg-zinc-950 hover:bg-zinc-800 text-zinc-400 text-xs py-2 px-2.5 rounded border border-zinc-800 transition" title="重新加载仓库默认底图">
            重置

        <!-- 画框与阴影微调 -->

            <input type="range" id="frameWidthInput" min="0" max="16" value="6" class="w-full accent-white" />
          </div>
          <div>
            <div class="flex justify-between text-[11px] text-zinc-400 mb-1">
              <span>阴影深度</span>
              <span id="shadowVal">35%</span>
            </div>
            <input type="range" id="shadowInput" min="0" max="80" value="35" class="w-full accent-white" />

    <!-- 底部导出按钮区 -->
    <div class="p-4 bg-zinc-950 border-t border-zinc-800 space-y-2">
      <button id="exportZipBtn" class="w-full bg-white hover:bg-zinc-200 text-black font-bold text-xs py-3 px-4 rounded-lg transition flex items-center justify-center gap-2 shadow-lg cursor-pointer">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path>
        </svg>
        一键打包导出 (三连无缝 1080×1800 ZIP)

      <button id="exportSingleBtn" class="w-full bg-zinc-800 hover:bg-zinc-700 text-zinc-200 font-medium text-xs py-2 px-4 rounded-lg transition cursor-pointer">

  <!-- 右侧实时预览区 -->
  <main class="flex-1 flex flex-col canvas-bg-grid min-h-screen">
    <!-- 顶部视图切换栏 -->
    <header class="h-14 bg-zinc-900/90 backdrop-blur border-b border-zinc-800 px-5 flex items-center justify-between">
      <div class="flex items-center gap-2 bg-zinc-950 p-1 rounded-lg border border-zinc-800">
        <button data-mode="slices" class="mode-btn active bg-white text-black text-xs font-semibold px-3 py-1.5 rounded-md transition">
          三连图无缝预览
        </button>
        <button data-mode="panorama" class="mode-btn text-zinc-400 hover:text-white text-xs font-medium px-3 py-1.5 rounded-md transition">
          三屏长卷全览 (3240×1800)
        </button>
        <button data-mode="single" class="mode-btn text-zinc-400 hover:text-white text-xs font-medium px-3 py-1.5 rounded-md transition">
          单张主海报 (1080×1800)
        </button>
      </div>
      <div class="text-xs text-zinc-400 font-mono hidden sm:block" id="resolutionInfo">
        三连无缝切片: 3 × (1080 × 1800 px)
      </div>
    </header>

    <!-- 画布居中展示区 -->
    <div class="flex-1 flex items-center justify-center p-6 lg:p-10 overflow-auto">
      <!-- 模式1 & 模式2 共用主预览 -->
      <div id="singlePreviewWrap" class="hidden relative shadow-2xl transition-all duration-200">
        <canvas id="previewCanvas" class="max-h-[80vh] max-w-[92vw] w-auto rounded-sm shadow-2xl block"></canvas>
      </div>

      <!-- 模式3：三连图并排无缝预览 -->
      <div id="slicesPreviewWrap" class="flex flex-col md:flex-row items-center justify-center gap-3">
        <div class="text-center">
          <canvas id="slice1Canvas" class="max-h-[72vh] w-auto shadow-2xl block border border-zinc-700"></canvas>
          <span class="text-[11px] font-mono text-zinc-400 mt-2 inline-block">01_第一屏主海报.jpg</span>
        </div>
        <div class="text-center">
          <canvas id="slice2Canvas" class="max-h-[72vh] w-auto shadow-2xl block border border-zinc-700"></canvas>
          <span class="text-[11px] font-mono text-zinc-400 mt-2 inline-block">02_第二屏无缝左半.jpg</span>
        </div>
        <div class="text-center">
          <canvas id="slice3Canvas" class="max-h-[72vh] w-auto shadow-2xl block border border-zinc-700"></canvas>
          <span class="text-[11px] font-mono text-zinc-400 mt-2 inline-block">03_第三屏无缝右半.jpg</span>
        </div>
      </div>
    </div>
  </main>

  <script>
    // ==========================================
    // 1. 纯原生零依赖二进制 EXIF 解析引擎
    // ==========================================
    function parseExifFromBuffer(buffer) {
      const view = new DataView(buffer);
      if (view.byteLength < 4 || view.getUint16(0, false) !== 0xFFD8) return null;

      let offset = 2;
      const length = view.byteLength;

      while (offset < length) {
        if (view.getUint8(offset) !== 0xFF) break;
        const marker = view.getUint8(offset + 1);
        if (marker === 0xE1) {
          return readExifData(view, offset + 4);
        }
        if (offset + 4 > length) break;
        offset += 2 + view.getUint16(offset + 2, false);
      }
      return null;
    }

    function readExifData(view, start) {
      if (view.getUint32(start, false) !== 0x45786966) return null;
      const tiffOffset = start + 6;
      const endian = view.getUint16(tiffOffset, false);
      const littleEndian = endian === 0x4949;
      if (!littleEndian && endian !== 0x4D4D) return null;

      const firstIFDOffset = view.getUint32(tiffOffset + 4, littleEndian);
      const tags = readIFD(view, tiffOffset, tiffOffset + firstIFDOffset, littleEndian);

      if (tags[0x8769]) {
        const exifTags = readIFD(view, tiffOffset, tiffOffset + tags[0x8769], littleEndian);
        Object.assign(tags, exifTags);
      }
      return tags;
    }

    function readIFD(view, tiffStart, dirStart, littleEndian) {
      const entries = {};
      if (dirStart + 2 > view.byteLength) return entries;
      const numEntries = view.getUint16(dirStart, littleEndian);

      for (let i = 0; i < numEntries; i++) {
        const entryOffset = dirStart + 2 + i * 12;
        if (entryOffset + 12 > view.byteLength) break;
        const tag = view.getUint16(entryOffset, littleEndian);
        const type = view.getUint16(entryOffset + 2, littleEndian);
        const count = view.getUint32(entryOffset + 4, littleEndian);
        const valueOffset = entryOffset + 8;

        entries[tag] = readTagValue(view, tiffStart, valueOffset, type, count, littleEndian);
      }
      return entries;
    }

    function readTagValue(view, tiffStart, valueOffset, type, count, littleEndian) {
      const typeSizes = { 1: 1, 2: 1, 3: 2, 4: 4, 5: 8, 7: 1, 9: 4, 10: 8 };
      const totalBytes = (typeSizes[type] || 1) * count;
      const dataOffset = totalBytes > 4 ? tiffStart + view.getUint32(valueOffset, littleEndian) : valueOffset;

      if (dataOffset + totalBytes > view.byteLength) return null;

      if (type === 2) {
        let str = "";
        for (let i = 0; i < count - 1; i++) {
          const ch = view.getUint8(dataOffset + i);
          if (ch === 0) break;
          str += String.fromCharCode(ch);
        }
        return str.trim();
      }
      if (type === 3) {
        return view.getUint16(dataOffset, littleEndian);
      }
      if (type === 4) {
        return view.getUint32(dataOffset, littleEndian);
      }
      if (type === 5) {
        const num = view.getUint32(dataOffset, littleEndian);
        const den = view.getUint32(dataOffset + 4, littleEndian);
        return den ? num / den : 0;
      }
      if (type === 10) {
        const num = view.getInt32(dataOffset, littleEndian);
        const den = view.getInt32(dataOffset + 4, littleEndian);
        return den ? num / den : 0;
      }
      return null;
    }

    function formatCameraModel(make, model) {
      if (!model && !make) return "";
      let m = (model || "").toUpperCase().trim();
      let mk = (make || "").toUpperCase().trim();
      m = m.replace(/^ILCE-/, "A");
      if (mk && !m.startsWith(mk) && !mk.includes("SONY") && !mk.includes("DJI")) {
        return `${mk} ${m}`;
      }
      if (mk.includes("SONY") && !m.startsWith("SONY")) {
        return `SONY ${m}`;
      }
      return m || mk;
    }

    function formatShutterSpeed(val) {
      if (!val || val <= 0) return "";
      if (val >= 1) {
        return Number.isInteger(val) ? `${val}s` : `${val.toFixed(1)}s`;
      }
      const denom = Math.round(1 / val);
      return `1/${denom}`;
    }

    // ==========================================
    // 2. 应用状态与自然石膏白砖墙兜底纹理
    // ==========================================
    const state = {
      photoImg: null,
      demoImg: null,
      repoBgImg: null,
      customBgImg: null,
      organicBrickPattern: null,
      viewMode: 'slices',
      camera: 'SONY A6400',
      focal: '24mm',
      aperture: 'F1.8',
      shutter: '1/30',
      iso: 'ISO 100',
      copyright: '© 2026 ESCAGE. ALL RIGHTS RESERVED.',
      frameWidth: 6,
      shadowStrength: 35
    };

    function seededRandom(seed) {
      const x = Math.sin(seed * 9301 + 49297) * 233280;
      return x - Math.floor(x);
    }

    function createOrganicBrickWallCanvas(width = 3240, height = 1800) {
      const c = document.createElement('canvas');
      c.width = width;
      c.height = height;
      const ctx = c.getContext('2d');

      ctx.fillStyle = '#e5e7eb';
      ctx.fillRect(0, 0, width, height);

      const brickH = 42;
      const baseBrickW = 132;
      const mortar = 5;

      let seed = 101;
      for (let row = 0; row * (brickH + mortar) < height + brickH; row++) {
        const y = row * (brickH + mortar);
        let cursorX = (row % 2 === 0) ? -seededRandom(seed++) * 20 : -(baseBrickW * 0.5) - seededRandom(seed++) * 25;

        while (cursorX < width + baseBrickW) {
          const wJitter = (seededRandom(seed++) - 0.5) * 14;
          const bw = baseBrickW + wJitter;
          const bhJitter = (seededRandom(seed++) - 0.5) * 2;
          const by = y + bhJitter;

          const baseLum = 243 + Math.floor((seededRandom(seed++) - 0.5) * 12);
          const warmTint = Math.floor((seededRandom(seed++) - 0.5) * 3);
          ctx.fillStyle = `rgb(${baseLum + warmTint}, ${baseLum + warmTint}, ${baseLum})`;

          ctx.beginPath();
          ctx.roundRect(cursorX, by, bw, brickH, 3);
          ctx.fill();

          const spots = 4;
          for (let s = 0; s < spots; s++) {
            const sx = cursorX + seededRandom(seed++) * (bw - 24);
            const sy = by + seededRandom(seed++) * (brickH - 12);
            const sw = 12 + seededRandom(seed++) * 28;
            const sh = 6 + seededRandom(seed++) * 14;
            ctx.fillStyle = seededRandom(seed++) > 0.5 ? 'rgba(255,255,255,0.35)' : 'rgba(180,185,192,0.12)';
            ctx.fillRect(sx, sy, sw, sh);
          }

          ctx.fillStyle = 'rgba(255,255,255,0.75)';
          ctx.fillRect(cursorX + 2, by, bw - 4, 2);
          ctx.fillStyle = 'rgba(0,0,0,0.07)';
          ctx.fillRect(cursorX + 1, by + brickH - 2, bw - 2, 2.5);

          cursorX += bw + mortar + (seededRandom(seed++) - 0.5) * 2.5;
        }
      }

      const imgData = ctx.getImageData(0, 0, width, height);
      const data = imgData.data;
      for (let i = 0; i < data.length; i += 4) {
        const grain = (seededRandom(i * 0.013) - 0.5) * 9;
        data[i] = Math.min(255, Math.max(0, data[i] + grain));
        data[i + 1] = Math.min(255, Math.max(0, data[i + 1] + grain));
        data[i + 2] = Math.min(255, Math.max(0, data[i + 2] + grain));
      }
      ctx.putImageData(imgData, 0, 0);

      [540, 1620, 2700].forEach(cx => {
        const grad = ctx.createRadialGradient(cx, height * 0.32, 80, cx, height * 0.5, 950);
        grad.addColorStop(0, 'rgba(255,255,255,0.20)');
        grad.addColorStop(1, 'rgba(0,0,0,0.06)');
        ctx.fillStyle = grad;
        ctx.fillRect(cx - 540, 0, 1080, height);
      });

      return c;
    }

    function createDemoPhoto() {
      const c = document.createElement('canvas');
      c.width = 1800;
      c.height = 1200;
      const ctx = c.getContext('2d');

      const seaGrad = ctx.createLinearGradient(0, 0, 1260, 1200);
      seaGrad.addColorStop(0, '#3a4f52');
      seaGrad.addColorStop(0.5, '#596b67');
      seaGrad.addColorStop(1, '#3d4c4e');
      ctx.fillStyle = seaGrad;
      ctx.fillRect(0, 0, 1800, 1200);

      ctx.fillStyle = '#9e7634';
      ctx.beginPath();
      ctx.moveTo(1180, 0);
      ctx.bezierCurveTo(1270, 420, 1340, 780, 1410, 1200);
      ctx.lineTo(1800, 1200);
      ctx.lineTo(1800, 0);
      ctx.closePath();
      ctx.fill();

      for (let i = 0; i < 8000; i++) {
        const sx = 1180 + Math.random() * 620;
        const sy = Math.random() * 1200;
        ctx.fillStyle = Math.random() > 0.5 ? 'rgba(40,25,10,0.35)' : 'rgba(240,200,120,0.35)';
        ctx.fillRect(sx, sy, 3, 3);
      }

      ctx.strokeStyle = 'rgba(255, 255, 255, 0.92)';
      ctx.lineWidth = 44;
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(1160, -20);
      ctx.bezierCurveTo(1250, 420, 1320, 780, 1390, 1220);
      ctx.stroke();

      ctx.strokeStyle = 'rgba(255, 255, 255, 0.45)';
      ctx.lineWidth = 16;
      ctx.beginPath();
      ctx.moveTo(940, -20);
      ctx.bezierCurveTo(1020, 450, 1100, 810, 1150, 1220);
      ctx.stroke();

      return c;
    }

    // ==========================================
    // 3. 辅助函数：将任意砖墙底图无痕镜像延展至 3240 × 1800
    // ==========================================
    function drawSeamlessBackground(ctx, bgImg, targetW, targetH) {
      const scale = targetH / bgImg.height;
      const tileW = bgImg.width * scale;
      let cursorX = 0;
      let index = 0;

      while (cursorX < targetW) {
        ctx.save();
        if (index % 2 === 1) {
          ctx.translate(cursorX + tileW, 0);
          ctx.scale(-1, 1);
          ctx.drawImage(bgImg, 0, 0, tileW, targetH);
        } else {
          ctx.drawImage(bgImg, cursorX, 0, tileW, targetH);
        }
        ctx.restore();
        cursorX += tileW;
        index++;
      }
    }

    // ==========================================
    // 核心缩放逻辑：以左上角为锚点，锁定基准宽/短边等比缩放
    // ==========================================
    function drawAnchoredFramedPhoto(ctx, img, anchorX, anchorY, baseSpanW, maxAllowedH) {
      const imgRatio = img.width / img.height;

      // 始终以 anchorX, anchorY 为固定左上角锚点
      // 横向基准锁定为 baseSpanW (第一屏 900px / 二三屏 1980px)，竖图时保持短边 900px 向下延伸
      let frameW = baseSpanW;
      let frameH = frameW / imgRatio;

      // 安全防溢出保护：若极端超长竖图超出画布可用高度，等比限制在 maxAllowedH 内且仍钉死左上角
      if (maxAllowedH && frameH > maxAllowedH) {
        frameH = maxAllowedH;
        frameW = frameH * imgRatio;
      }

      const frameX = anchorX;
      const frameY = anchorY;

      const border = state.frameWidth;
      const photoX = frameX + border;
      const photoY = frameY + border;
      const photoW = Math.max(10, frameW - border * 2);
      const photoH = Math.max(10, frameH - border * 2);

      // 墙面立体投影与黑色画框
      ctx.save();
      if (state.shadowStrength > 0) {
        const alpha = (state.shadowStrength / 100) * 0.65;
        ctx.shadowColor = `rgba(0, 0, 0, ${alpha})`;
        ctx.shadowBlur = 38;
        ctx.shadowOffsetX = 0;
        ctx.shadowOffsetY = 18;
      }
      ctx.fillStyle = '#0a0a0a';
      ctx.fillRect(frameX, frameY, frameW, frameH);
      ctx.restore();

      // 作品本体
      ctx.drawImage(img, photoX, photoY, photoW, photoH);

      return { frameX, frameY, frameW, frameH };
    }
